set-option -g history-limit 100000
set -g default-terminal "tmux-256color"
set -sg escape-time 0
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Split panes with | and -
bind | split-window -h
bind - split-window -v

# Mouse (new syntax)
set -g mouse on

# Status bar style
set -g status-position top
set -g status-style "bg=colour22,fg=colour44"

# Status bar content
set -g status-left ' ◆ #S ◆ #H ◇ '
set -g status-left-length 40
set -g status-right '#{prefix_highlight} ◇ CPU:#{cpu_percentage} ◇ #{=30:pane_current_path} ◆ '
set -g status-right-length 80

# Window format
set -g window-status-format ' #I:#W '
set -g window-status-current-format ' ▶ #I:#W ◀ '

# Inactive window style
set -g window-status-style "bg=colour22,fg=white"

# Active window highlight
set -g window-status-current-style "bg=colour44,fg=colour22,bold"

# Pane border colors
set -g pane-border-style "fg=#5ffdff,bg=colour236"
set -g pane-active-border-style "fg=#5ffdff,bg=colour236"

# Pane title
set -g pane-border-status top
set -g pane-border-format ' #{pane_title} '
set -g pane-border-lines double

# Message prompt style
set -g message-style "bg=colour174,fg=black"

# Activity monitor
set-window-option -g monitor-activity off
set -g visual-activity off

# Auto renumber windows
set -g renumber-windows on

# Plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-cpu'

# Plugin settings
set -g @continuum-save-interval '15'
set -g @prefix_highlight_bg 'colour167'
set -g @prefix_highlight_fg 'white'

# Initialize TPM (keep at bottom)
run -b '~/.tmux/plugins/tpm/tpm'
